  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 字母 A -->
  <path d="M32 14 L46 50 L38.5 50 L35.6 42 L28.4 42 L25.5 50 L18 50 Z
           M30.6 35.5 L33.4 35.5 L32 31.6 Z"
